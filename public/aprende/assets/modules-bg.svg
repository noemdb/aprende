<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05120d"/>
      <stop offset="100%" stop-color="#081c15"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1b3c2e" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <filter id="noise" x="0" y="0">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" result="saturateNoise"/>
      <feComponentTransfer in="saturateNoise" result="opacityNoise">
        <feFuncA type="table" tableValues="0.12 0.12 0 0.12 0.12 0.12 0.12 0.12 0.12 0.12 0.12 0.12 0.12 0.12 0.12 0.12 0.12 0.12 0.12 0.12"/>
      </feComponentTransfer>
    </filter>
  </defs>
  
  <!-- Fondo base -->
  <rect width="1200" height="800" fill="url(#bgGradient)" />
  
  <!-- Patrón sutil -->
  <rect width="1200" height="800" fill="url(#grid)" />
  
  <!-- Textura de ruido sutil -->
  <rect width="1200" height="800" fill="white" filter="url(#noise)" opacity="0.03"/>
  
  <!-- Elementos geométricos abstractos -->
  <g opacity="0.15">
    <circle cx="200" cy="150" r="250" fill="#4a7c59" />
    <circle cx="1000" cy="650" r="200" fill="#1b3c2e" />
    <circle cx="800" cy="100" r="150" fill="#2e5c4a" />
    <circle cx="400" cy="700" r="180" fill="#0a1f18" />
  </g>
  
  <!-- Elementos de gradiente sutil -->
  <g opacity="0.08">
    <rect x="-200" y="0" width="600" height="800" fill="#4a7c59" transform="rotate(-30 -200 0)"/>
    <rect x="800" y="0" width="600" height="800" fill="#2e5c4a" transform="rotate(20 800 0)"/>
  </g>
</svg>
