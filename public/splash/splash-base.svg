<svg width="2048" height="2732" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a7c59;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#05120d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="2048" height="2732" fill="url(#bgGradient)"/>
  
  <!-- Logo Circle -->
  <circle cx="1024" cy="1100" r="240" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.8"/>
  
  <!-- Text "KA" -->
  <text x="1024" y="1180" font-family="Arial, sans-serif" font-size="250" font-weight="bold" 
        fill="white" text-anchor="middle">KA</text>
        
  <!-- App Name -->
  <text x="1024" y="1500" font-family="Arial, sans-serif" font-size="100" font-weight="normal" 
        fill="white" text-anchor="middle" letter-spacing="10">KAINOS ACADEMY</text>
        
  <!-- Loading Dots -->
  <circle cx="904" cy="1700" r="20" fill="white" opacity="0.6"/>
  <circle cx="1024" cy="1700" r="20" fill="white" opacity="0.8"/>
  <circle cx="1144" cy="1700" r="20" fill="white" opacity="1.0"/>
